name: Validate Vietnamese translations

on:
  pull_request:
    branches: [main]
  push:
    branches: [i18n/vietnamese-settings-descriptions]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  l10n:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36"

      - name: Generate translation tables
        run: python scripts/gen-l10n.py

      - name: Check whitespace errors
        run: git diff --check

      - name: Run TikTok extension tests
        run: ./gradlew --no-daemon :extensions:tiktok:test
