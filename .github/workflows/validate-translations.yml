name: Validate Vietnamese translations

on:
  pull_request:
    branches: [main]
  push:
    branches: [i18n/vietnamese-settings-descriptions]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  l10n:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Accept Android SDK licenses and install platform
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-36"

      - name: Generate translation tables
        run: python scripts/gen-l10n.py

      - name: Check whitespace errors
        run: git diff --check

      - name: Run TikTok extension tests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon :extensions:tiktok:test
