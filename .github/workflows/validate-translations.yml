name: Validate Vietnamese translations

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: l10n-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  l10n:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install Android platform
        shell: pwsh
        run: |
          $sdkManager = Get-ChildItem "$env:ANDROID_HOME\cmdline-tools" -Recurse -Filter sdkmanager.bat | Select-Object -First 1
          if (-not $sdkManager) { throw "Android SDK manager was not found" }
          & $sdkManager.FullName "platforms;android-36"

      - name: Generate translation tables
        run: python scripts/gen-l10n.py

      - name: Check whitespace errors
        run: git diff --check

      - name: Run TikTok extension tests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\gradlew.bat --no-daemon :extensions:tiktok:test
