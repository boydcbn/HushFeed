name: Validate TikTok localization

on:
  pull_request:
    paths:
      - "extensions/tiktok/src/main/l10n/**"
      - "extensions/tiktok/src/main/java/app/morphe/extension/tiktok/settings/L10nTranslations*.java"
      - "extensions/tiktok/src/main/java/app/morphe/extension/tiktok/settings/preference/categories/**"
      - "scripts/gen-l10n.py"
      - ".github/workflows/validate-l10n.yml"
      - "extensions/tiktok/src/test/java/app/morphe/extension/tiktok/settings/SettingsL10nTest.java"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Android SDK components
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Regenerate localization sources
        run: python scripts/gen-l10n.py

      - name: Check whitespace errors
        run: git diff --check

      - name: Check official AAPT2 Linux artifact checksum
        run: |
          curl --fail --location --silent --show-error \
            "https://dl.google.com/dl/android/maven2/com/android/tools/build/aapt2/9.1.0-14792394/aapt2-9.1.0-14792394-linux.jar" \
            --output "$RUNNER_TEMP/aapt2-9.1.0-14792394-linux.jar"
          sha256sum "$RUNNER_TEMP/aapt2-9.1.0-14792394-linux.jar"

      - name: Run TikTok extension tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./gradlew :extensions:tiktok:test --no-daemon

      - name: Ensure generated localization files are committed
        if: always()
        run: git diff --exit-code -- 'extensions/tiktok/src/main/java/app/morphe/extension/tiktok/settings/L10nTranslations*.java' extensions/tiktok/src/main/l10n/en.csv
